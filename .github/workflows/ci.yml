name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  freeze-sets:
    name: Freeze sets exclude append-after-freeze files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check every study's freeze set
        run: python tools/check_freeze_sets.py

  standalone-components:
    name: Deterministic standalone components
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Acquisition proxy
        working-directory: acquisition-proxy
        run: python3 -m unittest test_attest -v
      - name: Portable derivation rule
        working-directory: derivation-rule
        run: python3 -m unittest test_derive -v
      - name: Fabrication gate
        working-directory: fabrication-gate
        run: python3 -m unittest test_gate -v

  evaluator-agreement:
    name: Go and Python evaluators agree byte for byte
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to an immutable reviewed commit rather than a branch. A moving
      # ref would let a runtime change decide, silently, whether this repository's
      # cross-implementation evidence still holds -- and the point of the check is
      # that a divergence is adjudicated against the SPECIFICATION TEXT, never by
      # preferring whichever implementation moved last.
      #
      # To advance the pin: change the ref below to another reviewed runtime
      # commit, run the harness locally against it, and say in the pull request
      # what the new commit changed about evaluation. A pin advanced together
      # with a row's expectation in one commit is the shape to refuse.
      - name: Check out the pinned Go runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Judgment-Pack/judgment-pack-runtime
          ref: f98d4c966e1cfc0f7b27a46310f2aaac20779792
          path: .runtime
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build the pinned runtime
        working-directory: .runtime
        run: env GO111MODULE=on CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/jpack" ./cmd/jpack
      - name: Compare both evaluators over the frozen corpus
        run: python3 harness/class_agreement.py ./jpack python
      # The frozen corpus has no error row, so the step above says nothing about WHICH §8.4 class
      # the two report. The specification's staged rows do; they are in no corpus, and this is
      # agreement evidence and not a corpus result. The vendored rows are held to recorded digests
      # first, so an expectation cannot be edited in place to make the comparison pass.
      - name: Hold the vendored staged rows to their digests, and test the error-class driver
        working-directory: harness
        run: python3 -m unittest test_error_class_agreement -v
      - name: Compare both evaluators' §8.4 error classes over the staged rows
        run: python3 harness/error_class_agreement.py ./jpack python
      # Draft RFC 0016, outcome values. The rows are the cases that RFC lists, each with the
      # answer its text gives, and both implementations are run under their opt-in. This is
      # agreement evidence about a draft and not a corpus result. The driver's verdicts and the
      # rows' expected answers are held first, against the script that writes them, so that an
      # expectation cannot be edited in place to make the comparison pass.
      - name: Test the draft RFC 0016 driver and hold its rows to the script that writes them
        working-directory: harness
        run: python3 -m unittest test_rfc0016_harness -v
      - name: Compare both evaluators over draft RFC 0016's rows
        run: python3 harness/rfc0016_harness.py ./jpack python

  study-001-harness:
    name: Study 001 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        # The study's harness is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run the harness, arm and scorer suite
        # Fully offline: no model backend and no evaluator binary. Arm B is
        # driven against a stub CLI, which is the only way to reach the exit
        # statuses the fail-closed rule turns on --- a conformant runtime
        # cannot be asked for "a valid envelope *and* exit 3". Also pins the
        # render policy that keeps gold and the redaction record out of what
        # any arm hands a model or the runtime. The graded batch itself is an
        # attempt, not a test, and never runs here.
        working-directory: studies/001-policy-representation
        run: python -m pytest harness/tests -q

  study-005-harness:
    name: Study 005 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Validate frozen fixtures and receipt behavior
        working-directory: studies/005-semantic-source-discovery
        run: python harness/study.py validate
      - name: Run harness and scorer tests
        working-directory: studies/005-semantic-source-discovery
        run: python -m unittest -v harness/test_study.py

  study-011-harness:
    name: Study 011 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        # The study's harness is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify the ported bytes against Study 010's lock
        working-directory: studies/011-authorship-coverage-rates
        run: python harness/integrity.py
      - name: Run the harness, control and fixture suite
        # The batch itself is API-dependent and never runs here; this suite is
        # deterministic and offline, and drives the real wrapper against a
        # stand-in CLI and a stand-in HOME. `analysis` carries the post-hoc
        # diversity census: it recomputes DIVERSITY.md's tables from the
        # retained bytes and fails if the tree or the document has drifted.
        working-directory: studies/011-authorship-coverage-rates
        run: python -m pytest harness/tests analysis -q

  study-012-harness:
    name: Study 012 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The interpreter is a registry pin (PREREGISTRATION.md §2.10): the
          # harness, the wrapper and the scorer all refuse another
          # implementation or version series, so the series is pinned here and
          # the patch level is whatever the runner resolves.
          python-version: "3.12"
      - name: Install pytest
        # The study's harness is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify the ported bytes and the arm artifacts (§6 C1, C8, C9, C10)
        working-directory: studies/012-policy-perturbation
        # README step 0 exports the safe import path for every command below
        # it, and this entry file REFUSES without it: invoking a script by path
        # puts its own directory first on sys.path, so its head imports resolve
        # from the directory the untracked-source scan exists to police (round
        # 10, finding 1).
        env:
          PYTHONSAFEPATH: "1"
        run: python harness/integrity.py
      - name: Run the harness, control and fixture suite
        # The batch itself is API-dependent and never runs here; this suite is
        # deterministic and offline, and drives the real wrapper against a
        # stand-in CLI and a stand-in HOME.
        #
        # PYTHONDONTWRITEBYTECODE is load-bearing rather than hygiene: without
        # it 61 of these tests fail. They run C1 as a batch precondition, and
        # §2.10's untracked-source gate refuses pytest's own assertion-rewrite
        # caches (harness/tests/__pycache__/*.cpython-312-pytest-*.pyc,
        # "unmappable name"). `-p no:cacheprovider` keeps .pytest_cache out of
        # the tree that gate walks. Both are what README step 0's ceremony
        # already uses.
        working-directory: studies/012-policy-perturbation
        env:
          PYTHONSAFEPATH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest harness/tests -q -p no:cacheprovider

  evidence-sufficiency:
    name: Evidence sufficiency · frozen case set
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every frozen cell replays
        working-directory: evidence-sufficiency
        run: python replay.py
      - name: Run the case-set tests
        # Stdlib only, offline, no model: the case set drives the shipped
        # derivation rule and the clean-room evaluator over frozen artifacts.
        working-directory: evidence-sufficiency
        run: python -m unittest test_replay -v

  study-014-harness:
    name: Study 014 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter, not the series: harness/PINS.json
          # records 3.12.11 and harness/score.py refuses to adjudicate under
          # anything else.
          python-version: "3.12.11"
      - name: Install OpenWorkProof at the pinned commit
        # Hash-checked lockfile (upstream's, mirror index removed - see
        # studies/014-openworkproof-binding/upstream/MANIFEST.sha256), then the
        # package itself with no dependency resolution. Source is never vendored.
        run: |
          git clone https://github.com/dengyier/OpenWorkProof /tmp/OpenWorkProof
          git -C /tmp/OpenWorkProof checkout --quiet 8eeca6fff4a246374f9d64f4dc1af6ace42118d5
          python -m pip install --disable-pip-version-check -r studies/014-openworkproof-binding/upstream/requirements-lock-pypi.txt
          python -m pip install --disable-pip-version-check --no-deps /tmp/OpenWorkProof
          python -m pip install --disable-pip-version-check pytest
      - name: Fetch the pinned jpack release and verify its digests
        # The replay tuple's executable leg: archive and binary digests are the
        # ones harness/PINS.json records; a mismatch fails the job.
        run: |
          curl -sSL -o /tmp/jpack.tar.gz https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v0.16.0/judgment-pack_0.16.0_linux_amd64.tar.gz
          echo "1a12503ca96061da3a8d5657528cea643668ef53a00a9b336e94755e2437ed59  /tmp/jpack.tar.gz" | sha256sum --check
          mkdir -p /tmp/jpack-bin && tar -xzf /tmp/jpack.tar.gz -C /tmp/jpack-bin jpack
          echo "7c11ebef430dec9a325fa3dd036963b6bbf5e2519f9c350a7ab89fb100b79325  /tmp/jpack-bin/jpack" | sha256sum --check
      - name: Run the adapter, control and fixture suite
        # Deterministic and offline once the toolchain is staged: the suite
        # verifies frozen fixture manifests, the whole-study manifest, the
        # SPEC/code verdict vocabulary sync and per-code reachability, the
        # upstream probes, a full rebuild of every cell, two byte-compared
        # scorer runs, and the registered controls. Both OWP_SOURCE and
        # JPACK_BIN are required - the suite fails rather than skips without
        # them, which is why the clone staged above is exported here. The matrix
        # adjudication itself is an attempt, not a test, and never runs here.
        working-directory: studies/014-openworkproof-binding
        env:
          JPACK_BIN: /tmp/jpack-bin/jpack
          OWP_SOURCE: /tmp/OpenWorkProof
        run: python -m pytest harness/tests -q

  study-016-harness:
    name: Study 016 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter: harness/PINS.json records 3.12.11 and
          # harness/score.py refuses to adjudicate under anything else.
          python-version: "3.12.11"
      - name: Install OpenWorkProof at the pinned commit
        # Same apparatus as Study 014 (same commit, same hash-checked lockfile
        # with the mirror index removed, same installed-package digest pin).
        run: |
          git clone https://github.com/dengyier/OpenWorkProof /tmp/OpenWorkProof
          git -C /tmp/OpenWorkProof checkout --quiet 8eeca6fff4a246374f9d64f4dc1af6ace42118d5
          python -m pip install --disable-pip-version-check -r studies/016-policy-currency-anchor/upstream/requirements-lock-pypi.txt
          python -m pip install --disable-pip-version-check --no-deps /tmp/OpenWorkProof
          python -m pip install --disable-pip-version-check pytest
      - name: Fetch the pinned jpack release and verify its digests
        # v0.17.0, the tuple every chain's commitment records; the archive
        # digest matches the release checksums.txt and the binary digest is the
        # one harness/PINS.json pins (reproduced from the tag - see the pin).
        run: |
          curl -sSL -o /tmp/jpack.tar.gz https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v0.17.0/judgment-pack_0.17.0_linux_amd64.tar.gz
          echo "4046a101e3b638eee87f5d3f2f17b8337d2e4be35a34d45060789639b816d8dc  /tmp/jpack.tar.gz" | sha256sum --check
          mkdir -p /tmp/jpack-bin && tar -xzf /tmp/jpack.tar.gz -C /tmp/jpack-bin jpack
          echo "42f35f7900bea6dfce215631b50729ab22dd347289e1bde3412604fb043a22e9  /tmp/jpack-bin/jpack" | sha256sum --check
      - name: Run the registry, harness and fixture suite
        # Deterministic and offline once the toolchain is staged: per-code
        # reachability and ordering for the currency vocabulary, the SPEC/code
        # sync, the frozen Study 014 source pins, registered identity groups,
        # a full rebuild byte-compared against the committed cells, two
        # byte-compared scorer runs, and the registered controls. Both
        # OWP_SOURCE and JPACK_BIN are required - the suite fails rather than
        # skips without them. The matrix adjudication itself is an attempt,
        # not a test, and never runs here.
        working-directory: studies/016-policy-currency-anchor
        env:
          JPACK_BIN: /tmp/jpack-bin/jpack
          OWP_SOURCE: /tmp/OpenWorkProof
        run: python -m pytest harness/tests -q

  study-017-harness:
    name: Study 017 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter: harness/PINS.json records 3.12.11 and
          # harness/score.py refuses to adjudicate under anything else.
          python-version: "3.12.11"
      - name: Install the two third-party dependencies
        # Fully offline apparatus: no evaluator binary, no external clone. The
        # versions match the 016 apparatus venv the study was built in.
        run: python -m pip install --disable-pip-version-check "cryptography==49.0.0" "rfc8785==0.1.4" pytest
      - name: Run the witness, harness and fixture suite
        # Deterministic and offline: per-code reachability and ordering for the
        # witness vocabulary, the SPEC/code sync, the frozen Study 016 upstream
        # pins, the structurally validated collusion pair, a full rebuild
        # byte-compared against the committed cells, two byte-compared scorer
        # runs, and the registered controls. The matrix adjudication itself is
        # an attempt, not a test, and never runs here.
        working-directory: studies/017-witnessed-currency
        run: python -m pytest harness/tests -q

  study-018-harness:
    name: Study 018 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install the two registered dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==49.0.0" "rfc8785==0.1.4" pytest
      - name: Run the rule, harness and fixture suite
        # Fully offline: no evaluator binary, no external clone. Per-code
        # reachability for the transition vocabulary, the SPEC/code sync, the
        # frozen Study 016 upstream pins, the registered identity group (the
        # backdated-citation exhibit), the structural check that the four
        # divergence cells differ only in their rule configuration, a full
        # rebuild byte-compared against the committed cells, and two
        # byte-compared scorer runs. The matrix adjudication itself is an
        # attempt, not a test, and never runs here.
        working-directory: studies/018-transition-rules
        run: python -m pytest harness/tests -q

  study-019-harness:
    name: Study 019 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The fixed CI runtime, and the honest statement of what it is
          # (round-5 finding R5-5). harness/PINS.json registers the CPython
          # 3.12 SERIES and integrity.verify_interpreter() enforces
          # implementation and series; the patch level is deliberately
          # reported at run time and not required (Study 012's round 3,
          # finding 20). Naming 3.12.11 here fixes the runner so this job is
          # reproducible, and it is not a claim that another patch would be
          # refused.
          python-version: "3.12.11"
      - name: Install pytest
        # Fully offline apparatus: the harness, the design generators and the
        # controls are stdlib-only, so pytest is the whole install. No evaluator
        # binary, no external clone.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify the port chain, the pins and the study manifest
        # `integrity.py` refuses to run without PYTHONSAFEPATH=1: invoking a
        # script by path puts that script's own directory first on `sys.path`
        # before any byte of the file runs, so the operator applies -P and this
        # step establishes that they did.
        working-directory: studies/019-authorship-across-representations
        env:
          PYTHONSAFEPATH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python harness/integrity.py
      - name: Run the harness, design and control suite
        # Deterministic and offline: the registered partition and its per-code
        # reachability, the transcript binding, the leak-token screen, the
        # scorer's population and publication rules, the ports chain, the
        # manifest's currency with the tree, and the currency assertions that
        # recompute every count the preregistration states from the artifact it
        # states it about. THE MATRIX ADJUDICATION NEVER RUNS HERE: it is an
        # ATTEMPT, not a test (§7), and neither it nor anything that invokes
        # `codex`, `jpack` or `opa` is part of this job. The engine-backed
        # pipeline module skips itself unless the pinned binaries are present
        # and hash to their pins, which in CI they are not.
        # `PYTHONDONTWRITEBYTECODE` is not decoration: `integrity.verify()`
        # refuses any `.pyc` the running interpreter did not produce, so a test
        # run that writes bytecode would break the step above on the next run.
        working-directory: studies/019-authorship-across-representations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest harness/tests -q

  study-020-harness:
    name: Study 020 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The fixed CI runtime, and the honest statement of what it is,
          # carried from Study 019's job. harness/PINS.json registers the
          # CPython 3.12 SERIES and integrity.verify_interpreter() enforces
          # implementation and series; the patch level is deliberately reported
          # at run time and not required (Study 012's round 3, finding 20).
          # Naming 3.12.11 here fixes the runner so this job is reproducible,
          # and it is not a claim that another patch would be refused.
          python-version: "3.12.11"
      - name: Install pytest
        # Fully offline apparatus: the harness is stdlib-only, so pytest is the
        # whole install. No evaluator binary, no external clone.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify the port chain, the pins and the study manifest
        # `integrity.py` refuses to run without PYTHONSAFEPATH=1: invoking a
        # script by path puts that script's own directory first on `sys.path`
        # before any byte of the file runs, so the operator applies -P and this
        # step establishes that they did.
        #
        # This step reads STUDY 019's tree as well as this one: the port chain
        # binds every row to a digest 019's own registry pins (PORTS.md), so a
        # checkout that carried 020 without 019 would refuse here rather than
        # verify nothing.
        working-directory: studies/020-test-pinning-across-representations
        env:
          PYTHONSAFEPATH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python harness/integrity.py
      - name: Render the round-status sentence and require it to be current
        # ADR 0005, decision 2, and §7's delta 10. The lifecycle is DATA in
        # PREREG-REVIEW.md's block and the two front doors carry ONE sentence
        # rendered from it. `--check` is the non-writing half: it fails when a
        # front door's sentence is not what the block renders, which is the
        # hand-written-status failure mode ADR 0005 registers against.
        working-directory: studies/020-test-pinning-across-representations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python harness/render_round_status.py --check
      - name: Run the harness suite
        # Deterministic and offline: the registered partition and its per-code
        # reachability including 020's new `presence-idiom-unsound`, the
        # presence-idiom detector and its mutation check, the survivor-vector
        # schema's four refusals, the two identity relations and E6's
        # non-gating property, the transcript binding, the leak-token screen,
        # the label rule over both pin tuples and the sweep exemption, the
        # ports chain over all twenty rows, the manifest's currency with the
        # tree, and the round-lifecycle layer.
        #
        # THE BATCH NEVER RUNS HERE and neither does the attempt: §7 forbids
        # invoking `codex`, `jpack` or `opa` in CI, so no engine path is
        # exercised and the engine-backed modules skip themselves unless the
        # pinned binaries are present and hash to their pins — which in CI they
        # are not. The tests that read a study ARTIFACT §4.1 has not ported yet
        # skip by a named reason (harness/SCAFFOLD.md item A1) rather than
        # passing vacuously.
        #
        # `PYTHONDONTWRITEBYTECODE` is not decoration: `integrity.verify()`
        # refuses any `.pyc` the running interpreter did not produce, so a test
        # run that writes bytecode would break the step above on the next run.
        working-directory: studies/020-test-pinning-across-representations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest harness/tests -q

  python:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}  # the job's default directory does not exist before the checkout
        # the retained attempts hold cells named by construction and artifacts named by digest; the paths exceed 260 characters
        run: git config --global core.longpaths true
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        # The implementation itself is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Confirm the implementation imports without third-party packages
        run: python -c "import jps_evaluator; print(jps_evaluator.__name__)"

  study-015-harness:
    name: Study 015 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter, not the series: harness/PINS.json records
          # 3.12.11 and harness/score.py refuses to adjudicate under anything else.
          python-version: "3.12.11"
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          # The pinned probe node (harness/PINS.json harnessNode.version).
          node-version: "22.23.1"
      - name: Clone Cloudflare OS at the pinned commit and install its lockfile
        # Upstream's own pnpm-lock.yaml via the corepack-pinned pnpm; no postinstall
        # scripts exist in the workspace and --ignore-scripts keeps dependency build
        # scripts inert. Source is never vendored (CFOS_SOURCE points at the clone).
        run: |
          git clone https://github.com/cloudflare/cloudflare-os /tmp/cloudflare-os
          git -C /tmp/cloudflare-os checkout --quiet b2a51b5426398c8353d9d4dd984bd525121ab5f2
          corepack enable
          cd /tmp/cloudflare-os && pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch the pinned jpack release and verify its digests
        run: |
          curl -sSL -o /tmp/jpack.tar.gz https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v0.16.0/judgment-pack_0.16.0_linux_amd64.tar.gz
          echo "1a12503ca96061da3a8d5657528cea643668ef53a00a9b336e94755e2437ed59  /tmp/jpack.tar.gz" | sha256sum --check
          mkdir -p /tmp/jpack-bin && tar -xzf /tmp/jpack.tar.gz -C /tmp/jpack-bin jpack
          echo "7c11ebef430dec9a325fa3dd036963b6bbf5e2519f9c350a7ab89fb100b79325  /tmp/jpack-bin/jpack" | sha256sum --check
      - name: Install the pinned harness dependencies
        working-directory: studies/015-cloudflare-os-boundary
        run: python -m pip install --disable-pip-version-check -r harness/requirements.txt
      - name: Run the protocol-integrity, reachability and upstream-probe suites
        # The suite covers the SPEC/code vocabulary and ordering sync, per-code
        # reachability, the registry and manifest gates, the fixture typecheck against
        # the pinned server-side types, and the upstream-behaviour probes.
        working-directory: studies/015-cloudflare-os-boundary
        env:
          CFOS_SOURCE: /tmp/cloudflare-os
          JPACK_BIN: /tmp/jpack-bin/jpack
        run: python -m pytest harness/tests -q
